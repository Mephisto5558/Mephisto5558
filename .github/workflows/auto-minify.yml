name: Reusable AutoMinify for JS and CSS

on:
  workflow_call:
    inputs:
      css_input_dir:
        description: 'Directory for CSS files to minify'
        required: false
        type: string
        default: 'css/*'
      css_output_dir:
        description: 'Output directory for minified CSS files'
        required: false
        type: string
        default: 'min/css/'
      js_input_dir:
        description: 'Directory for JS files to minify'
        required: false
        type: string
        default: 'js/*'
      js_output_dir:
        description: 'Output directory for minified JS files'
        required: false
        type: string
        default: 'min/js/'
    secrets:
      GPG_PRIVATE_KEY:
        required: false

permissions:
  contents: write

jobs:
  minify-and-commit:
    runs-on: ubuntu-latest
    env:
      HAS_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY != '' }}
    steps:
      - name: check out the repository
        uses: actions/checkout@v5

      - name: Import GPG key
        if: env.HAS_GPG_KEY == 'true'
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          git_user_signingkey: true
          git_commit_gpgsign: true

      - name: Auto minify CSS
        uses: nizarmah/auto-minify@v3
        with:
          overwrite: true # if false, filenames would be {name}.min.css
          directory: ${{ inputs.css_input_dir }}
          output: ${{ inputs.css_output_dir }}

      - name: Auto minify JS
        uses: nizarmah/auto-minify@v3
        with:
          overwrite: true # if false, filenames would be {name}.min.js
          js_engine: 'uglify-js' # babel does not accept any config and errors due to the source type being "module"
          directory: ${{ inputs.js_input_dir }}
          output: ${{ inputs.js_output_dir }}

      - name: Commit and push signed changes
        if: ${{ steps.import-gpg.outcome == 'success' }}
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Workflow: Minify CSS and JS"
          commit_user_name: ${{ steps.import-gpg.outputs.name }}
          commit_user_email: ${{ steps.import-gpg.outputs.email }}

      - name: Commit and push unsigned changes
        if: ${{ steps.import-gpg.outcome != 'success' }}
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "Workflow: Minify CSS and JS"
